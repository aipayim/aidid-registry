# Validate the AIDID integration registry and auto-merge challenge-verified changes.
#
# Policy (decided by the AIDID project, 2026-10-11): a pull request that ONLY edits
# `rp-registry.json` is merged automatically once DNS/domain ownership is proven —
# that is, once `https://<origin>/.well-known/aidid-rp.txt` serves exactly the
# registered `challenge`. A listing proves control of the origin; it is NOT a
# security or reputation endorsement.
#
# Fail-closed rules enforced below:
#   - any challenge mismatch / bad structure  -> the validate step fails, no merge;
#   - any verified entry that could not be checked live (network) -> [SKIP] -> no merge;
#   - a pull request that touches any file other than `rp-registry.json` -> no merge.
#
# Known limits (do not pretend otherwise):
#   - Fork pull requests get a read-only GITHUB_TOKEN, so `gh pr merge` cannot run for
#     them; the merge step skips forks and a maintainer must merge manually.
#   - If this repository enables branch protection requiring human approvals or
#     required status checks beyond this workflow, the automatic merge will be
#     blocked until those are satisfied.
name: validate-registry

on:
  pull_request:
    paths:
      - rp-registry.json

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    name: Validate rp-registry.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Structure + a live fetch of every verified entry's .well-known file.
      # A [SKIP] means the challenge was NOT proven, so we refuse to merge below.
      - name: Validate structure and live challenges
        run: |
          log="$RUNNER_TEMP/validate-registry.log"
          node scripts/validate-registry.mjs > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          if grep -qF '[SKIP]' "$log"; then
            echo "::error::A verified entry could not be checked live — refusing to auto-merge (fail-closed)."
            exit 1
          fi

      # The auto-merge policy is deliberately strict: ONLY rp-registry.json.
      - name: Require that only rp-registry.json changed
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files="$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')"
          echo "Changed files:"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -vxF 'rp-registry.json' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::This pull request changes files other than rp-registry.json — refusing to auto-merge."
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "only_registry=true" >> "$GITHUB_OUTPUT"

      - name: Merge (same-repository pull requests only)
        if: steps.scope.outputs.only_registry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::This pull request comes from a fork ($HEAD_REPO). GITHUB_TOKEN is read-only for fork pull requests, so it cannot be merged automatically — a maintainer must merge it."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
